name: Deploy Contoso Trek SRE demo

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'infra/**'
      - 'scripts/**'
      - 'sre-config/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'infra/**'
      - 'scripts/**'
      - 'sre-config/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment_name:
        description: Environment name
        type: string
        default: demo
      location:
        description: Azure region
        type: string
        default: francecentral
      configure_agent:
        description: Configure the SRE Agent data plane
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
  NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
  ENV_NAME: ${{ github.event.inputs.environment_name || 'demo' }}
  LOCATION: ${{ github.event.inputs.location || 'francecentral' }}
  OWNER: frkim
  COST_CENTER: demo

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24

      - name: Validate Bicep
        run: |
          az bicep build --file infra/main.bicep
          az bicep lint --file infra/main.bicep

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, node24
        with:
          python-version: '3.12'
          cache: pip

      - name: Lint and test API
        working-directory: src/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          ruff check .
          pytest

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0, node24
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/package-lock.json
          registry-url: https://packagefeedproxy.microsoft.io/npm/

      - name: Build and test web
        working-directory: src/web
        run: |
          npm ci
          npm run build
          npm test

      - name: Validate scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    environment: demo
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24

      - name: Azure login with OIDC
        if: ${{ vars.AZURE_CLIENT_ID != '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0, node24
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Azure login with credentials fallback
        if: ${{ vars.AZURE_CLIENT_ID == '' }}
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0, node24
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy infrastructure and images
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          LOCATION: ${{ env.LOCATION }}
          OWNER: ${{ env.OWNER }}
          COST_CENTER: ${{ env.COST_CENTER }}
        run: bash scripts/deploy.sh

      - name: Configure SRE Agent
        if: ${{ github.event.inputs.configure_agent != 'false' }}
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          LOCATION: ${{ env.LOCATION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          SRE_AGENT_GITHUB_PAT: ${{ secrets.SRE_AGENT_GITHUB_PAT }}
        run: bash scripts/configure-agent.sh

      - name: Smoke test
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          LOCATION: ${{ env.LOCATION }}
        run: bash scripts/smoke-test.sh

      - name: Deployment summary
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          LOCATION: ${{ env.LOCATION }}
        run: |
          source scripts/_env.sh
          WEB_URL="$(get_web_url)"
          SUBSCRIPTION_ID="$(az account show --query id --output tsv)"
          {
            echo "## Contoso Trek SRE demo"
            echo
            echo "- Web URL: ${WEB_URL}"
            echo "- SRE Agent portal: https://sre.azure.com"
            echo "- Azure portal resource group: https://portal.azure.com/#@/resource/subscriptions/${SUBSCRIPTION_ID}/resourceGroups/${RG}/overview"
          } >> "$GITHUB_STEP_SUMMARY"
